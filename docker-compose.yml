version: "3.9"

services:
  db:
    image: postgres:16
    container_name: chessmate-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha-segura-123
      POSTGRES_DB: chessmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chessmate-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chessmate-backend
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/chessmate
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: senha-segura-123
      JWT_SECRET: chave_super_segura_base64
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chessmate-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chessmate-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
      VITE_WS_URL: http://localhost:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chessmate-net

volumes:
  pgdata:

networks:
  chessmate-net:
    driver: bridge
